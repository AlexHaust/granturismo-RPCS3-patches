PPU-6ac472e1f334f54ec4753cde9e8e1515bfab4d17:

  "Enable Bloom/Glare in All Cameras":
    Games:
      "Gran Turismo 6":
        BCUS98296: [ 01.22 ]
    Author: "AlexHaust"
    Patch Version: 1.0
    Notes: "Bloom/glare in every camera, not just bumper. Cannot be combined with Disable SPU MLAA."
    Patch:
      - [ be32, 0x0056D95C, 0x38000001 ] # li r0,1       (was clrldi r9,r3,32)   flag setter
      - [ be32, 0x0056D960, 0x98030004 ] # stb r0,4(r3)  (was stb r5,4(r9))
      - [ be32, 0x0056E1DC, 0x38000001 ] # li r0,1       (was clrldi r9,r31,32)  enableFlags/disableFlags
      - [ be32, 0x0056E1E0, 0x981F0004 ] # stb r0,4(r31) (was stb r30,4(r9))
      - [ be32, 0x00570234, 0x38000001 ] # li r0,1       (was li r0,0)           constructor reset

  "Disable SPU MLAA":
    Games:
      "Gran Turismo 6":
        BCUS98296: [ 01.22 ]
    Author: "AlexHaust"
    Patch Version: 1.0
    Notes: "Removes Morphological Anti-Aliasing, known as \"MLAA\", a form of post process anti-aliasing which is done using the CELL's SPUs instead of the RSX for extra performance."
    Patch:
      - [ be32, 0x008C2004, 0x60000000 ] # nop (was bl 0xC2FED4, first MLAA job call)
      - [ be32, 0x008C2080, 0x60000000 ] # nop (was bl 0xC2FD90, GPU wait on the SPU job semaphore)
      - [ calloc, 0x008C2060, 21 ] # replaces bl 0xC2FED4 (MLAA job), returns to 0x8C2064
      - [ be32, 0x0, 0xF821FF01 ] # stdu r1,-0x100(r1)
      - [ be32, 0x0, 0x7C0802A6 ] # mflr r0
      - [ be32, 0x0, 0xF8010110 ] # std r0,0x110(r1)
      - [ be32, 0x0, 0x80E40000 ] # lwz r7,0(r4) (src: scene buffer address)
      - [ be32, 0x0, 0x81040004 ] # lwz r8,4(r4) (src pitch)
      - [ be32, 0x0, 0xA0040014 ] # lhz r0,0x14(r4) (width)
      - [ be32, 0x0, 0xF8010070 ] # std r0,0x70(r1)
      - [ be32, 0x0, 0xA0040016 ] # lhz r0,0x16(r4) (height)
      - [ be32, 0x0, 0xF8010078 ] # std r0,0x78(r1)
      - [ be32, 0x0, 0x38000004 ] # li r0,4 (bytes per pixel)
      - [ be32, 0x0, 0xF8010080 ] # std r0,0x80(r1)
      - [ be32, 0x0, 0x80830004 ] # lwz r4,4(r3) (dst pitch)
      - [ be32, 0x0, 0x80630000 ] # lwz r3,0(r3) (dst: display buffer address)
      - [ be32, 0x0, 0x38A00000 ] # li r5,0 (dst x)
      - [ be32, 0x0, 0x38C00000 ] # li r6,0 (dst y)
      - [ be32, 0x0, 0x39200000 ] # li r9,0 (src x)
      - [ be32, 0x0, 0x39400000 ] # li r10,0 (src y)
      - [ jumpl, 0x0, 0x00C3E050 ] # bl copy wrapper (dst, dpitch, dx, dy, src, spitch, sx, sy; w/h/bpp on stack)
      - [ be32, 0x0, 0xE8010110 ] # ld r0,0x110(r1)
      - [ be32, 0x0, 0x7C0803A6 ] # mtlr r0
      - [ be32, 0x0, 0x38210100 ] # addi r1,r1,0x100

  "Disable Motion Blur":
    Games:
      "Gran Turismo 6":
        BCUS98296: [ 01.22 ]
    Author: "illusion, AlexHaust"
    Patch Version: 1.0
    Notes: "Disables motion blur in replay mode. Fixes black replay screen."
    Patch:
      - [ be32, 0x008C2B4C, 0x38600000 ] # li r3,0 (was bl)

  "Extended FOV":
    Games:
      "Gran Turismo 6":
        BCUS98296: [ 01.22 ]
    Author: "AlexHaust"
    Patch Version: 1.0
    Configurable Values: *gt6_fov_configurable_values
    Notes: "Widens the field of view in all race cameras and replays."
    Patch:
      - [ bef32, 0x011D6938, "FOV" ] # half-angle factor in the perspective builder (stock 0.5)

  "Aspect Ratio":
    Games:
      "Gran Turismo 6":
        BCUS98296: [ 01.22 ]
    Author: "AlexHaust"
    Patch Version: 1.0
    Notes: 'Requires "Stretch To Display Area" checked in the GPU settings. HUD, menus and UI keep their 16:9 layout. For a sharper image, also enable Disable SPU MLAA and raise Resolution Scale.'
    Configurable Values:
      "Aspect Ratio":
        Type: double_enum
        Value: 5.333333333333333
        Allowed Values:
          "1 monitor, 16:9 (unmodified)": 1.777777777777778
          "1 monitor, 16:10": 1.6
          "1 monitor, 21:9 (2560x1080)": 2.37037037037037
          "1 monitor, 21:9 (3440x1440)": 2.388888888888889
          "1 monitor, 21:9 (3840x1600)": 2.4
          "1 monitor, 32:9 / 2 monitors, 16:9": 3.555555555555556
          "1 monitor, 4:3": 1.333333333333333
          "1 monitor, 5:4": 1.25
          "2 monitors, 16:10 (32:10)": 3.2
          "3 monitors, 16:9 (48:9)": 5.333333333333333
          "3 monitors, 16:10 (48:10)": 4.8
          "3 monitors, 21:9 2560x1080 (64:9)": 7.111111111111111
          "3 monitors, 21:9 3440x1440 (43:6)": 7.166666666666667
          "3 monitors, 4:3 (12:3)": 4.0
          "3 monitors, 5:4 (15:4)": 3.75
          "3 monitors, 16:9 portrait (27:16)": 1.6875
          "5 monitors, 16:9 (80:9)": 8.88888888888889
    Patch:
      - [ bef32, 0x01550880, "Aspect Ratio" ] # target aspect (unused page tail after the code segment)
      - [ bef32, 0x01550884, 1.70 ] # lower bound of "16:9"
      - [ bef32, 0x01550888, 1.85 ] # upper bound of "16:9"
      - [ calloc, 0x008A615C, 9 ] # screen-aspect getter wrapper 0x8A6144, right after bl 0x8FF168; returns to 0x8A6160
      - [ be32, 0x0, 0xE8010080 ] # ld r0, 0x80(r1) (original)
      - [ be32, 0x0, 0x3D200155 ] # lis r9, 0x155
      - [ be32, 0x0, 0xC0090884 ] # lfs f0, 0x884(r9) (1.70)
      - [ be32, 0x0, 0xFF810000 ] # fcmpu cr7, f1, f0
      - [ be32, 0x0, 0x419C0014 ] # blt cr7, +0x14 (keep stock; lands on the return branch)
      - [ be32, 0x0, 0xC0090888 ] # lfs f0, 0x888(r9) (1.85)
      - [ be32, 0x0, 0xFF810000 ] # fcmpu cr7, f1, f0
      - [ be32, 0x0, 0x419D0008 ] # bgt cr7, +0x8 (keep stock)
      - [ be32, 0x0, 0xC0290880 ] # lfs f1, 0x880(r9) (return the chosen aspect)

